user nginx;
worker_processes 1;

error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  root /app/public;

  keepalive_timeout  65;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log  /var/log/nginx/access.log;
  error_log   /var/log/nginx/error.log;

  sendfile on;

  server {
    listen 80;
    listen [::]:80;
    server_name api.hustcode.app;

    location /.well-known/acme-challenge {
      allow all;
      alias /var/www/certbot/.well-known/acme-challenge;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 default_server ssl;
    server_name api.hustcode.app;

    # Enable HTTP2
    http2 on;

    client_max_body_size 200M;

    ssl_certificate /etc/letsencrypt/live/api.hustcode.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hustcode.app/privkey.pem;

    location /ws/ {
      proxy_pass        http://hustcode_api_node_app:4000;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Ssl on;
      proxy_set_header   X-Forwarded-Port $server_port;
      proxy_set_header   X-Forwarded-Host $host;

      proxy_buffering off;

      # Need to increase, default is 60s
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
    }

    location / {
      proxy_pass        http://hustcode_api_node_app:4000;
      proxy_set_header  Host $host;
      proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header  X-Forwarded-Proto $scheme;
      proxy_set_header  X-Forwarded-Ssl on;
      proxy_set_header  X-Forwarded-Port $server_port;
      proxy_set_header  X-Forwarded-Host $host;
    }
  }
}
